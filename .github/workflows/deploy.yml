name: Deploy to AWS S3 + CloudFront

on:
  push:
    branches:
      - master

env:
  AWS_REGION: eu-central-1
  S3_BUCKET: matko-klima-site
  CLOUDFRONT_DISTRIBUTION_ID: E2C0A1SLPGLGOH

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync assets to S3 (with long cache)
        run: |
          aws s3 sync out/ s3://${{ env.S3_BUCKET }}/ \
            --region ${{ env.AWS_REGION }} \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" \
            --exclude "*.txt" \
            --delete

      - name: Sync HTML to S3 (with short cache)
        run: |
          aws s3 sync out/ s3://${{ env.S3_BUCKET }}/ \
            --region ${{ env.AWS_REGION }} \
            --cache-control "public,max-age=0,must-revalidate" \
            --content-type "text/html" \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "📦 S3 Bucket: s3://${{ env.S3_BUCKET }}"
          echo "🌐 CloudFront URL: https://d2crwjjvl1nyot.cloudfront.net"
          echo "🔄 Cache invalidation initiated"
